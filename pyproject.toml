[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "onefig"
dynamic = ["version"]
description = "A simple, typed YAML config system built on OmegaConf and Pydantic."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Ben Viggiano", email = "viggiano@stanford.edu" }]
keywords = ["config", "configuration", "yaml", "pydantic", "omegaconf"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "omegaconf>=2.3",
    "pydantic>=2.7",
    "typing-extensions>=4.0",
    "namekit>=0.1.3",
    "eval_type_backport>=0.2; python_version < '3.10'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.15",
    "mypy>=1.8",
]
docs = ["mkdocs-material>=9.5"]

[project.urls]
Homepage = "https://github.com/bviggiano/onefig"
Documentation = "https://bviggiano.github.io/onefig/"
Repository = "https://github.com/bviggiano/onefig"
Issues = "https://github.com/bviggiano/onefig/issues"

[project.scripts]
onefig = "onefig._cli_entry:main"

[tool.hatch.version]
path = "src/onefig/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/onefig"]

[tool.hatch.build.targets.sdist]
exclude = ["/.github", "/assets", "/docs"]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.10"  # mypy cannot target 3.9; requires-python is >=3.9
plugins = ["pydantic.mypy"]
files = ["src"]

[[tool.mypy.overrides]]
module = "namekit.*"
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.9"
